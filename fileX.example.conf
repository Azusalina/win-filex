# 打开程序使用参数列表，不经过 shell。{path}=绝对路径，{filex}=本项目，{toolkit}=相邻 toolkit。
# terminal=true：TUI 优先使用 tmux 右侧空闲 pane，否则当前终端。
[openers.system]
label = "系统默认"
# system uses the native Windows association; omit command to keep its built-in value.
terminal = false

[openers.vscodium]
label = "VSCodium"
command = ["codium", "--", "{path}"]
terminal = false

[openers.vim]
label = "Vim"
command = ["vim", "--", "{path}"]
terminal = true

[openers.nvim]
label = "Neovim"
command = ["nvim", "--", "{path}"]
terminal = true

[openers.nano]
label = "Nano"
command = ["nano", "--", "{path}"]
terminal = true

[openers.firefox]
label = "Firefox"
command = ["firefox", "{path}"]
terminal = false

# Enter 选择 Python 执行，或将 open_defaults 的 .py 改为 python。
# 终端程序在文件所在目录运行；脚本输出结束后返回 TUI。
[openers.python]
extensions = [".py", ".pyw"]
label = "Python 执行"
command = ["python", "{path}"]
terminal = true
pause_on_exit = true # TUI 当前终端按 Enter 返回；tmux pane 留下输出

# 自动复制 Markdown 路径，再使用相邻 toolkit 的渲染器在 Firefox 打开。
# 可把 {toolkit} 改为其他 toolkit 的完整路径；不占用既有 4177 端口。
[openers.rscript]
extensions = [".r"]
label = "Rscript 执行"
command = ["Rscript", "{path}"]
terminal = true
pause_on_exit = true

[openers.bash]
extensions = [".sh", ".bash"]
label = "Bash 执行"
command = ["bash", "--", "{path}"]
terminal = true
pause_on_exit = true

[openers.markdown]
extensions = [".md", ".markdown"]
label = "Toolkit Markdown / Firefox"
command = ["node", "{filex}/scripts/open_markdown.mjs", "--toolkit", "{toolkit}", "--browser", "firefox", "--", "{path}"]
terminal = false
copy_path = true

# Enter 显示选择菜单并优先列出默认程序；o 直接使用默认程序。
[openers.unzip]
extensions = [".zip"]
label = "Bash unzip / 解压 ZIP"
command = ["bash", "--", "{filex}/scripts/unzip.sh", "{path}"]
terminal = true
pause_on_exit = true

[open_defaults]
".zip" = "unzip"
# 可添加 ".r" = "rscript" / ".sh" = "bash"；Enter 菜单也可选择运行。
".md" = "system"
".markdown" = "system"
".py" = "notepad"
".html" = "system"
".htm" = "system"
"*" = "system"
"<directory>" = "system"

# 可使用单字符、Ctrl+字母、Ctrl+Shift+字母或 Ctrl+Alt+字母；不可重复。
# Arrow / Enter / Space / Esc / H / L / Ctrl+C / Ctrl+U 保留；parent 可用 Left。
# Ctrl+F 和 / 总是可用于搜索；Shift+R 重命名，F5 / Ctrl+F5 刷新，Ctrl+Alt+C 复制路径。
[keys]
toggle_grouped = "v"
reorder = "O"
hide_item = "z"
hidden_items = "Z"
quit = "Q"
exit_here = "x" # 退出并将启动 terminal 切到选中目录；需要 filex shell function
dashboard = "q"
dashboard_narrow = "[" # 缩窄信息面板，运行时调整不写入配置
dashboard_widen = "]"  # 加宽信息面板
link_info = "I" # 完整文件 / 链接信息，TUI 可滚动
up = "k"
down = "j"
expand = "l"
collapse = "h"
expand_all = "E"
collapse_all = "C"
open = "o"
open_with = "w"
preview = "p"
hidden = "."
refresh = "Ctrl+r"
search = "Ctrl+f"
next_match = "n"
previous_match = "N"
goto = "g"
parent = "Left" # ← 返回父级；根节点时引入上级目录
focus_root = "f"
temporary_focus = "F" # 临时只显示所选分支；再次按恢复，不写入隐藏配置
new_file = "a" # Ctrl+N 同样新建文件
new_folder = "A" # Ctrl+Shift+N / Ctrl+Alt+N 同样新建目录
rename = "r" # Shift+R 也可重命名
copy = "c"
copy_path = "Ctrl+Alt+c"
move = "m"
trash = "D"
git_menu = "G" # Git 菜单：暂存、提交、推送及一键流程
run_foreground = "@" # 前台执行命令，显示输出 / 接受输入；结束 Enter 返回
run_background = "!" # 选中文件夹，输入命令后在该目录后台执行
help = "?"
config = ","

[tmux]
open_in_right_pane = false # 终端程序优先复用右侧空闲 pane；否则当前终端

[input_method]
auto_english = false # Windows 终端输入法切换取决于宿主；true 为尽力请求英文并在退出时恢复

[links]
scan_limit = 10000 # q / I 按需查找硬链接其他路径，仅当前根目录内，不跟随软链接
max_results = 32  # 包含隐藏路径；达到扫描 / 结果上限会提示

[terminal]
mode = "auto" # auto Windows console; tty 限制为终端编辑器 / 内置预览
color_mode = "truecolor" # auto / 16 / 256 / truecolor / consistent / none；NO_COLOR 优先
charset = "unicode" # 字体缺字可设为 ascii；文件名保持 Unicode
cli_opener = "auto"
konsole_shortcuts = false # 仅为 Linux 配置兼容保留，Windows 不使用
 tmux_extended_keys = false # Windows 不使用 tmux

[openers.notepad]
label = "Notepad"
command = ["notepad.exe", "{path}"]
terminal = false

[openers.powershell]
extensions = [".ps1"]
label = "PowerShell script"
command = ["powershell.exe", "-NoProfile", "-File", "{path}"]
terminal = true
pause_on_exit = true

# 排序：先 top（按列表顺序），再普通项（沿用 directories_first/sort），最后 bottom。
[order]
sequence = [] # 完整顺序示例：["README.md", "d-%", "%-d", "%"]；首个匹配生效
# % 匹配任意长度，= 前缀强制字面名称（例如 "=100%.txt"）。
top = [] # 例如 ["index.html", "README.md"]
bottom = [] # 例如 ["node_modules", "__pycache__"]

# 指定目录：绝对路径、~/路径，或同名目录。未写的字段继承全局，[] 清空继承。
# [directory_order."~/Documents/site"]
# sequence = ["README.md", "d-%", "%-d", "%"]
# top = ["index.html"]
# bottom = ["<other-folders>", "node_modules"]
# <other-folders> 匹配未在 top/bottom 中显式点名的所有子目录（不含目录软链接）。
# 可放在 top 或 bottom；显式名称优先，匹配到的目录沿用 sort 排序。

# [directory_order."/home/a/Documents/someProducts/Visualize-sheet"]
# top = ["launch.sh", "index.html"]


# 整棵子树的排序：此目录及任意深度的子目录都遵循；路径必须是绝对路径或 ~/。
# 可混合精确文件名与 % 通配扩展名；同一项匹配多个模式时，取列表中的第一个。
# [recursive_order."~/Documents/sba"]
# sequence = ["%.html", "%.css", "%.js", "%"]
# 文件名示例：["README.md", "index.html", "%.html", "%.css", "%.js", "%"]
# 同一字段优先级：directory_order > 最近的 recursive_order > 更高祖先 > order。
# [] 清空该字段的继承；O 手动排序仅写 directory_order，不影响其他子目录。

[git]
enabled = true
max_entries = 4000 # 每个仓库的状态映射上限（包括父目录），最多缓存 4 个仓库；F5 更新
