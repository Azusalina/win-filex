# win-filex v1.5 — TOML 格式。复制到 %APPDATA%/win-filex/filex.conf，
# 或使用 filex --config /完整路径/filex.conf。
# 修改后 TUI 按 ,。
[browser]
excluded_paths = [] # z 隐藏的绝对路径；Z 恢复，独立于 . 显示隐藏文件
show_hidden = false
directories_first = true
sort = "name"          # name / size（大→小）/ modified（新→旧）
max_entries = 1000     # 每个目录普通显示上限，搜索定位的路径仍可显示
max_expand_nodes = 5000 # E 自动展开时最多访问的节点数
max_loaded_nodes = 6000 # Rust TUI 缓存上限；增大此值会增加内存使用

[layout]
grouped = false # 默认同级垂直罗列；v 才分开目录组 / 直属文件组
highlight_path = true # 祖先路径高亮，其余分支稍暗
column_gap = 6         # 3..20，横向列间距（字符格）
max_label_width = 32   # 12..120，完整路径仍显示于状态栏
row_spacing = 1       # 1..4

[dashboard]
dashboard_width = 36  # 20..240 列；[ / ] 每次缩窄 / 加宽 4 列；树至少保留 36 列

[search]
search_max_results = 500
search_scan_limit = 100000 # 递归搜索的条目扫描上限；不会跟随符号链接

[preview]
preview_lines = 5     # q / I 预览文件开头行数，0 关闭；0..1000，同时受 preview_bytes 限制
preview_bytes = 65536  # 1024..1048576，仅 UTF-8 文本预览

